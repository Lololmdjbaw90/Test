# Builds the iPhone / iPad app on a GitHub Mac and uploads an .ipa you can
# download from the run's "Artifacts" section.
#
# The .ipa is unsigned: install it on your own device with Sideloadly or
# AltStore (they sign it with your Apple ID). For TestFlight / the App
# Store use the "Upload to App Store" workflow — see APP_STORE.md.
#
# Run it any time from the Actions tab → "Build iOS app (.ipa)" → Run workflow
# (the manual button appears once this file is on the default branch).
name: Build iOS app (.ipa)

on:
  workflow_dispatch:
  # Any change to the app itself produces a fresh .ipa.
  push:
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "ios/**"
      - "capacitor.config.json"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".env"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Copy it into the iOS project
        run: npx cap sync ios

      # Xcode 26 (the iOS 26 SDK) gives the native tab bar real Liquid Glass;
      # with an older Xcode it still builds, with a blur instead.
      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Sugerly-unsigned.ipa Payload
          ls -lh Sugerly-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Sugerly-ipa
          path: Sugerly-unsigned.ipa
          retention-days: 30
