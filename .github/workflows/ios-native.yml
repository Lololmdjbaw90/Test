# Builds the native SwiftUI app (native/) on a GitHub Mac and uploads an
# unsigned .ipa (install it with Sideloadly, like the other one). It's a
# separate app (com.mimilocks.sugerly), so it can sit next to the current one.
name: Build native iOS app (.ipa)

on:
  workflow_dispatch:
  # One build per change: the working branch only (main gets the same
  # commits, and a second Mac build would just use up minutes).
  push:
    branches:
      - "feature/app-redesign"
    paths:
      - "native/**"
      - ".github/workflows/ios-native.yml"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: native
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild \
            -project Sugerly.xcodeproj \
            -scheme Sugerly \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Test iPhone editor and Fanart interactions
        timeout-minutes: 18
        run: bash scripts/test-native-interactions.sh

      - name: Test Home scrolling on iPad
        timeout-minutes: 10
        run: bash scripts/test-native-interactions.sh iPad HomeIPadTests

      - name: Export interaction screenshots
        if: always()
        working-directory: native
        run: |
          if [ -d InteractionTests.xcresult ]; then
            xcrun xcresulttool export attachments --path InteractionTests.xcresult --output-path test-screenshots || true
          fi

      - name: Save simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-interaction-results
          path: |
            native/InteractionTests.xcresult
            native/HomeIPadTests.xcresult
            native/simulator-test.log
            native/test-screenshots

      - name: Show compile errors
        if: failure()
        working-directory: native
        run: grep -E "error:|reasonable time" build.log | head -80 || true

      # Small JPEG copies of the design screenshots, printed into the log so
      # they can be looked at without downloading the artifact.
      - name: Print preview screenshots
        if: always()
        working-directory: native
        run: |
          [ -f test-screenshots/manifest.json ] || exit 0
          python3 - <<'PY'
          import base64, json, os, subprocess
          want = ("compact-home", "compact-community", "compact-chats", "menu-full-screen-bottom",
                  "outlined-titles-rose", "outlined-titles-mint-dark", "bunny-new-bodies", "appearance-options")
          found = []
          def walk(x):
              if isinstance(x, dict):
                  name = x.get("suggestedHumanReadableName", "")
                  if x.get("exportedFileName", "").endswith(".png") and name.startswith(want):
                      found.append((name, x["exportedFileName"]))
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(json.load(open("test-screenshots/manifest.json")))
          for name, file in found:
              out = "/tmp/preview.jpg"
              subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "50", "--resampleWidth", "300",
                              os.path.join("test-screenshots", file), "--out", out], capture_output=True)
              data = base64.b64encode(open(out, "rb").read()).decode()
              key = name.split("_")[0]
              for i in range(0, len(data), 3000):
                  print(f"PREVIEW {key} {i // 3000} {data[i:i + 3000]}")
          PY

      - name: Package the .ipa
        working-directory: native
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sugerly.app Payload/
          # Put the app-group entitlements into the binaries (fake-signed) so
          # sideloading tools keep the widgets' shared data working.
          if brew install ldid >/dev/null 2>&1; then
            ldid -SSupport/Sugerly.entitlements Payload/Sugerly.app/Sugerly || true
            APPEX=Payload/Sugerly.app/PlugIns/SugerlyWidgets.appex
            if [ -d "$APPEX" ]; then ldid -SSugerlyWidgets/SugerlyWidgets.entitlements "$APPEX/SugerlyWidgets" || true; fi
          fi
          ls Payload/Sugerly.app/PlugIns || true
          zip -qry Sugerly-native-unsigned.ipa Payload
          ls -lh Sugerly-native-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Sugerly-native-ipa
          path: native/Sugerly-native-unsigned.ipa
          retention-days: 30
