# Builds the native SwiftUI app (native/) on a GitHub Mac and uploads an
# unsigned .ipa (install it with Sideloadly, like the other one). It's a
# separate app (com.mimilocks.sugerly), so it can sit next to the current one.
name: Build native iOS app (.ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios-native.yml"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild \
            -project Sugerly.xcodeproj \
            -scheme Sugerly \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          test -d build/Build/Products/Release-iphoneos/Sugerly.app

      - name: Show compile errors
        if: failure()
        working-directory: native
        run: grep -E "error:" build.log | head -80 || true

      - name: Package the .ipa
        working-directory: native
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sugerly.app Payload/
          zip -qry Sugerly-native-unsigned.ipa Payload
          ls -lh Sugerly-native-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sugerly-native-ipa
          path: native/Sugerly-native-unsigned.ipa
          retention-days: 30

  ui-smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate simulator project
        working-directory: native
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          brew install xcodegen
          xcodegen generate
      - name: Test native navigation and settings on iPhone
        working-directory: native
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for rows in d["devices"].values() for v in rows if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -project Sugerly.xcodeproj -scheme Sugerly -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath UITestResults.xcresult CODE_SIGNING_ALLOWED=NO > ui-test.log 2>&1
      - name: Export screenshots and diagnostics
        if: always()
        working-directory: native
        run: |
          grep -E 'error:|Test Case|Executed|failed|passed' ui-test.log | tail -80 || true
          if [ -d UITestResults.xcresult ]; then xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path Screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sugerly-ui-checks
          path: |
            native/Screenshots
            native/ui-test.log
          retention-days: 14
