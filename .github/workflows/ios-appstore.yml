# Builds the native Sugerly app (native/, SwiftUI), signs it with your Apple
# Developer account and uploads it to App Store Connect (TestFlight), all on a
# GitHub Mac, so you can release from Windows. See APP_STORE.md.
#
# Needs 4 repository secrets (GitHub → Settings → Secrets and variables →
# Actions → New repository secret):
#   APPLE_TEAM_ID                – 10 characters, developer.apple.com → Account → Membership
#   APP_STORE_CONNECT_KEY_ID     – App Store Connect → Users and Access → Integrations → API key "Key ID"
#   APP_STORE_CONNECT_ISSUER_ID  – shown above the keys list on that page
#   APP_STORE_CONNECT_KEY        – the whole text of the downloaded AuthKey_XXXX.p8 file
# The API key needs the "Admin" role: Xcode uses it to create the signing
# certificate and profile in Apple's cloud, so you never need a Mac.
#
# Run it from Actions → "Upload to App Store" → Run workflow.
name: Upload to App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on the App Store (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see APP_STORE.md"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd native && xcodegen generate

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Test iPhone editor and Fanart interactions
        timeout-minutes: 18
        run: bash scripts/test-native-interactions.sh

      - name: Test Home scrolling on iPad
        timeout-minutes: 10
        run: bash scripts/test-native-interactions.sh iPad HomeIPadTests

      - name: Export interaction screenshots
        if: always()
        run: |
          if [ -d native/InteractionTests.xcresult ]; then
            xcrun xcresulttool export attachments --path native/InteractionTests.xcresult --output-path native/test-screenshots || true
          fi

      - name: Save interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-interaction-results
          path: |
            native/InteractionTests.xcresult
            native/HomeIPadTests.xcresult
            native/simulator-test.log
            native/test-screenshots

      # Let Xcode manage signing; do not revoke account-wide certificates.
      - name: Archive (signed)
        run: |
          xcodebuild \
            -project native/Sugerly.xcodeproj \
            -scheme Sugerly \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Sugerly.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sugerly.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded version ${{ inputs.version }} (build ${{ github.run_number }}). It shows up in App Store Connect → TestFlight in ~10–30 minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
