<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/brand/sugerly-mark.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sugerly — a cozy home for artists: gallery, community feed, music, servers and messages." />
    <meta name="theme-color" content="#fbf7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110a0f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sugerly" />
    <title>Sugerly</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("mimilocks:__theme") || "{}");
          var dark = t.theme === "dark" || (t.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (t.accent) document.documentElement.setAttribute("data-accent", t.accent);
          var logo = /^(rose|lavender|mint|peach|sky)$/.test(t.accent || "") ? t.accent : "rose";
          window.__sugerlyLogo = "/brand/sugerly-logo-" + logo + "-sm.webp";
          var pre = document.createElement("link"); pre.rel = "preload"; pre.as = "image"; pre.href = window.__sugerlyLogo;
          document.head.appendChild(pre);
        } catch (e) {}
      })();
    </script>
    <style>
      #app-loading{position:fixed;inset:0;z-index:99999;background:#fbf7f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:opacity .45s ease}
      .dark #app-loading{background:#110a0f}
      #app-loading img{height:72px;width:auto;animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    </style>
  </head>
  <body>
    <div id="app-loading"><script>document.write('<img src="' + (window.__sugerlyLogo || "/brand/sugerly-logo-rose-sm.webp") + '" alt="Sugerly" />');</script></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
