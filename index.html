<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/rendered-styles.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mimi Locks" />
    <title>Mimi Locks</title>
    <style>
      #app-loading{position:fixed;inset:0;z-index:99999;background:#fdf8f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:'Inter','Segoe UI',sans-serif;transition:opacity 0.4s;}
      #app-loading .logo{width:56px;height:56px;border-radius:16px;background:#e8a0b4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:white;}
      #app-loading .spinner{width:20px;height:20px;border:2px solid #f0e4ea;border-top-color:#e8a0b4;border-radius:50%;animation:spin 0.8s linear infinite;}
      @keyframes spin{to{transform:rotate(360deg);}}
    </style>
  </head>
  <body>
    <div id="app-loading"><div class="logo">M</div><div class="spinner"></div><p style="font-size:0.8rem;color:#999;font-weight:500">Mimi Locks</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded',function(){
        var o=new MutationObserver(function(){var r=document.getElementById('root');if(r&&r.children.length>0){setTimeout(function(){var l=document.getElementById('app-loading');if(l){l.style.opacity='0';setTimeout(function(){l.style.display='none';},400);}},300);o.disconnect();}});
        o.observe(document.getElementById('root'),{childList:true});
      });
    </script>
  </body>
</html>
