# Sugerly — native SwiftUI app (iPhone + iPad).
# The Xcode project is generated from this file with XcodeGen
# (`brew install xcodegen && xcodegen generate`); the GitHub workflow
# .github/workflows/ios-native.yml does that and builds the .ipa.
name: Sugerly
options:
  bundleIdPrefix: com.mimilocks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sugerly:
    type: application
    platform: iOS
    sources:
      - path: Sugerly
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sugerly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - Bubbly.ttf
          - CuteHere.otf
          - PlusJakartaSans.ttf
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIImageName: Logo
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Choose photos to post, send in chats or use as your profile picture.
        NSCameraUsageDescription: Take photos to share on Sugerly.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mimilocks.sugerly
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
