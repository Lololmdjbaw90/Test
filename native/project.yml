# Sugerly — native SwiftUI app (iPhone + iPad).
# The Xcode project is generated from this file with XcodeGen
# (`brew install xcodegen && xcodegen generate`); the GitHub workflow
# .github/workflows/ios-native.yml does that and builds the .ipa.
name: Sugerly
options:
  bundleIdPrefix: com.mimilocks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 114.0.0
    maxVersion: 200.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    OTHER_SWIFT_FLAGS: "-Xfrontend -solver-expression-time-threshold=30"
targets:
  Sugerly:
    type: application
    platform: iOS
    sources:
      - path: Sugerly
    dependencies:
      - package: WebRTC
      - target: SugerlyWidgets
    entitlements:
      path: Support/Sugerly.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mimilocks.app
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sugerly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Choose photos to post, send in chats or use as your profile picture.
        NSCameraUsageDescription: Take photos and film reels to share on Sugerly, with filters and face effects that run on your device.
        NSPhotoLibraryAddUsageDescription: Save reels you like to your photos.
        NSMicrophoneUsageDescription: Talk in calls and voice channels, send voice notes and record sound for the reels you film.
        NSAppleMusicUsageDescription: Play whole songs from Apple Music in Sugerly if you subscribe.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - voip
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.mimilocks.app.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.mimilocks.app
            CFBundleURLSchemes:
              - sugerly
        UIAppFonts:
          - Bubbly-Regular.otf
          - CuteHere.otf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mimilocks.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
  SugerlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SugerlyWidgets
    entitlements:
      path: SugerlyWidgets/SugerlyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mimilocks.app
    info:
      path: SugerlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sugerly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mimilocks.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
