[build]
  command = "npm run build"
  publish = "dist"

# The card payment server (Stripe): netlify/functions/*.mjs, reached at
# /.netlify/functions/<name>. Set here so it deploys whatever the site's
# settings say.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sugerly is an iPhone / iPad app only. The website just hosts what the
# App Store and payments need: Help (support URL), Terms / Privacy /
# Guidelines, the "payment done" page and the payment server below. Remove
# this to bring back the full web app.
[build.environment]
  VITE_LEGAL_SITE = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
